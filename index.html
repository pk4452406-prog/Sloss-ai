<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sloss AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#0a0a0f;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#13131a;padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2a3d}
.logo{font-size:20px;font-weight:700;background:linear-gradient(90deg,#6c63ff,#ff6584);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.dot{width:8px;height:8px;background:#00e676;border-radius:50%;margin-left:auto;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;animation:up 0.3s ease}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ai{background:#13131a;border:1px solid #2a2a3d;align-self:flex-start;border-top-left-radius:4px}
.user{background:#1e1b4b;border:1px solid rgba(108,99,255,0.3);align-self:flex-end;border-top-right-radius:4px}
.bottom{background:#13131a;border-top:1px solid #2a2a3d;padding:12px}
.row{display:flex;gap:8px}
textarea{flex:1;background:#1c1c28;border:1px solid #2a2a3d;border-radius:12px;color:#fff;font-size:14px;padding:10px 12px;resize:none;outline:none;font-family:Arial}
textarea:focus{border-color:#6c63ff}
button{width:44px;height:44px;background:linear-gradient(135deg,#6c63ff,#ff6584);border:none;border-radius:12px;cursor:pointer;font-size:20px}
#setup{background:#1c1c28;border:1px solid #6c63ff;border-radius:12px;padding:12px;margin-bottom:10px;font-size:13px}
#setup p{color:#aaa;margin-bottom:8px}
#setup a{color:#6c63ff}
.setup-row{display:flex;gap:8px}
.setup-row input{flex:1;background:#0a0a0f;border:1px solid #2a2a3d;border-radius:8px;color:#fff;padding:8px 10px;font-size:13px;outline:none}
.setup-row input:focus{border-color:#6c63ff}
.save-btn{background:#6c63ff;color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer}
.typing{display:flex;gap:5px;padding:4px 0;align-items:center}
.typing span{width:7px;height:7px;background:#6c63ff;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
</style>
</head>
<body>
<header>
<span class="logo">⚡ Sloss AI</span>
<div class="dot"></div>
</header>
<div id="chat">
<div class="msg ai">👋 Namaste! Main <b>Sloss AI</b> hoon. Hindi ya English mein kuch bhi poochho!</div>
</div>
<div class="bottom">
<div id="setup">
<p>🔑 Ek baar <a href="https://console.groq.com" target="_blank">console.groq.com</a> se free API Key lo aur yahan paste karo:</p>
<div class="setup-row">
<input type="password" id="keyInput" placeholder="gsk_..."/>
<button class="save-btn" onclick="saveKey()">Save</button>
</div>
</div>
<div class="row">
<textarea id="inp" rows="1" placeholder="Message likho..." onkeydown="handleKey(event)"></textarea>
<button onclick="send()">➤</button>
</div>
</div>
<script>
let key=localStorage.getItem('sloss_key')||'';
let msgs=[];
if(key)document.getElementById('setup').style.display='none';

function saveKey(){
const v=document.getElementById('keyInput').value.trim();
if(!v.startsWith('gsk_')){alert('Sahi key daalo! gsk_ se shuru honi chahiye');return;}
key=v;localStorage.setItem('sloss_key',key);
document.getElementById('setup').style.display='none';
addMsg('ai','✅ Key save! Ab chat karo.');
}

function addMsg(role,text){
const d=document.getElementById('chat');
const m=document.createElement('div');
m.className='msg '+role;
m.innerHTML=text;
d.appendChild(m);
d.scrollTop=d.scrollHeight;
return m;
}

function showTyping(){
const d=document.getElementById('chat');
const m=document.createElement('div');
m.className='msg ai';m.id='typing';
m.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
d.appendChild(m);d.scrollTop=d.scrollHeight;
}

async function send(){
const inp=document.getElementById('inp');
const text=inp.value.trim();
if(!text)return;
if(!key){alert('Pehle API Key save karo!');return;}
inp.value='';
addMsg('user',text);
msgs.push({role:'user',content:text});
showTyping();
try{
const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{
method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
body:JSON.stringify({
model:'llama3-8b-8192',
messages:[{role:'system',content:'Tum Sloss AI ho — ek helpful AI assistant. Hindi aur English dono mein baat karo. Jo bhasha user use kare usi mein jawab do. Short aur helpful answers do.'},...msgs.slice(-8)],
max_tokens:800
})
});
document.getElementById('typing')?.remove();
const data=await r.json();
const reply=data.choices[0].message.content;
msgs.push({role:'assistant',content:reply});
addMsg('ai',reply.replace(/\n/g,'<br>'));
}catch(e){
document.getElementById('typing')?.remove();
addMsg('ai','❌ Error aaya. API key check karo.');
}
}

function handleKey(e){
if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}
}
</script>
</body>
</html>
